<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanupCentr Farm Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg:       #0e1117;
  --surface:  #161b25;
  --surface2: #1e2433;
  --border:   #2a3147;
  --accent:   #4ade80;
  --accent2:  #22c55e;
  --text:     #e2e8f0;
  --muted:    #64748b;
  --radius:   12px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 700px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 80px 50px;
  text-align: center;
}

.icon {
  font-size: 72px;
  margin-bottom: 24px;
}

h1 {
  font-size: 3rem;
  margin-bottom: 20px;
  font-weight: 700;
}

p {
  color: var(--muted);
  font-size: 1.1rem;
  line-height: 1.8;
}

@media (max-width: 600px) {
  .card {
    padding: 60px 30px;
  }

  .icon {
    font-size: 56px;
  }

  h1 {
    font-size: 2.2rem;
  }

  p {
    font-size: 1rem;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <div class="icon">🚧</div>

    <h1>Under Maintenance</h1>

    <p>
      We're currently performing maintenance on the Farm Manager.<br><br>
      Please check back again later.
    </p>
  </div>
</div>

</body>
</html>
